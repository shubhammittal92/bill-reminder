# Render blueprint — provisions the backend API and a managed Postgres DB.
# Deploy: push to GitHub, then in Render click "New +" → "Blueprint" and pick
# this repo. Render reads this file and creates the services below.
services:
  - type: web
    name: bill-reminder-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bill-reminder-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random secret
      - key: CORS_ORIGIN
        sync: false # set this to your Vercel frontend URL after deploying it
      - key: GMAIL_USER
        sync: false # optional — set to enable real email
      - key: GMAIL_APP_PASSWORD
        sync: false # optional — a Google App Password

databases:
  - name: bill-reminder-db
    plan: free
